controller:
  componentType: "kubernetes"
  numExecutors: 0
  jenkinsUrl: ""
  jenkinsUrlProtocol: ""
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  
  # Kubernetes Agent configuration
  kubernetes:
    enabled: true
    namespace: jenkins
    jenkinsUrl: ""
    jenkinsTunnel: ""
    connectTimeout: 100
    readTimeout: 100
    maxRequestsPerHost: 32
    containerCap: 10
    retentionTimeout: 5
    templates:
      - name: "kaniko"
        label: "kaniko"
        nodeUsageMode: NORMAL
        containers:
          - name: "kaniko"
            image: "gcr.io/kaniko-project/executor:latest"
            alwaysPullImage: true
            workingDir: "/home/jenkins"
            command: "sleep"
            args: "99d"
            ttyEnabled: true
            resourceRequestCpu: "400m"
            resourceRequestMemory: "1Gi"
            resourceLimitCpu: "1"
            resourceLimitMemory: "2Gi"
            envVars:
              - envVar:
                  key: "DOCKER_CONFIG"
                  value: "/home/jenkins/.docker"
      - name: "git"
        label: "git"
        nodeUsageMode: NORMAL
        containers:
          - name: "git"
            image: "alpine/git:latest"
            alwaysPullImage: true
            workingDir: "/home/jenkins"
            command: "sleep"
            args: "99d"
            ttyEnabled: true
            resourceRequestCpu: "100m"
            resourceRequestMemory: "128Mi"
            resourceLimitCpu: "500m"
            resourceLimitMemory: "512Mi"

  # Service configuration
  serviceType: LoadBalancer
  servicePort: 8080
  serviceAnnotations: {}

  # Ingress configuration
  ingress:
    enabled: false

  # Admin user configuration
  adminUser: "admin"
  
  # Install plugins
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - docker-workflow:latest
    - credentials-binding:latest
    - aws-credentials:latest
    - pipeline-stage-view:latest

agent:
  enabled: false

persistence:
  enabled: true
  size: "10Gi"
  storageClass: "gp2"
  accessMode: "ReadWriteOnce"

